# SPDX-License-Identifier: Apache-2.0
# REUSE 3.x annotations for files that cannot carry an SPDX header comment
# (JSON, Markdown, byte-exact fixtures and goldens, fuzz corpora, binary assets).
# frost-lint checks that every such file is covered by an entry here or by a .license sidecar.
# Files with comment syntax (frost-lint's SOURCE_SYNTAX_BY_SUFFIX and SOURCE_SYNTAX_BY_NAME
# tables, including .clang-format, .clang-tidy, .gitignore and .gitattributes) carry their own
# SPDX header instead. Paths use REUSE 3.x globs: `*` stays in one directory, `**` crosses
# directories and `**/` also matches files at the root.
version = 1

[[annotations]]
path = ["**/*.json", "**/*.md", "LICENSE", "NOTICE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The FrostIDE authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["tests/**/fixtures/**", "tests/**/goldens/**", "tests/fuzz/corpus/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The FrostIDE authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["resources/**/*.png", "resources/**/*.ico", "resources/icons/frost/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The FrostIDE authors"
SPDX-License-Identifier = "Apache-2.0"

# vcpkg overlay ports copied from microsoft/vcpkg (MIT; LICENSE-vcpkg.txt in each port), ADR 0014.
# "override" so the Apache-2.0 *.json entry above does not claim the ports' vcpkg.json files.
[[annotations]]
path = ["third_party/vcpkg-ports/**"]
precedence = "override"
SPDX-FileCopyrightText = "Microsoft Corporation and vcpkg contributors"
SPDX-License-Identifier = "MIT"

# The getopt that replaces crashpad's public-domain one is FrostIDE's own code (ADR 0022). Being the
# last match, this table replaces the vcpkg-ports rule above for that one patch.
[[annotations]]
path = ["third_party/vcpkg-ports/crashpad/frost-getopt.patch"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The FrostIDE authors"
SPDX-License-Identifier = "Apache-2.0"

# Pinned third-party assets (resources/assets.lock.json, ADR 0015). When several tables match a
# file, REUSE uses the last one, so these tables (after the generic Apache-2.0 rules above, such
# as **/*.json) are the ones that apply; "override" also makes REUSE ignore any notice inside
# the files themselves, which are upstream bytes we never edit.
[[annotations]]
path = ["resources/icons/lucide/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Lucide Icons and Contributors", "2013-present Cole Bemis"]
SPDX-License-Identifier = "ISC AND MIT"

[[annotations]]
path = ["resources/fonts/inter/**"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["resources/fonts/jetbrains-mono/**"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# The screenshot goldens are FrostIDE renderings that show Lucide icons, so they carry both our
# terms and Lucide's (renderings of the OFL fonts are program output, which the OFL does not
# restrict). Being the last match, this table replaces the tests/**/goldens/** rule above for
# these files rather than adding to it, so it lists every holder and licence itself (ADR 0015,
# question 2).
[[annotations]]
path = ["tests/ui/goldens/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 The FrostIDE authors", "2026 Lucide Icons and Contributors",
                          "2013-present Cole Bemis"]
SPDX-License-Identifier = "Apache-2.0 AND ISC AND MIT"

# Vendored tree-sitter sources (third_party/vendor.lock.json, ADR 0023): upstream bytes under
# each project's MIT licence, with the copyright line of its LICENSE file.
[[annotations]]
path = ["third_party/tree-sitter/**"]
precedence = "override"
SPDX-FileCopyrightText = "2018 Max Brunsfeld"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["third_party/grammars/c/**", "third_party/grammars/cpp/**", "third_party/grammars/json/**"]
precedence = "override"
SPDX-FileCopyrightText = "2014 Max Brunsfeld"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["third_party/grammars/c-sharp/**"]
precedence = "override"
SPDX-FileCopyrightText = "2014-2023 Max Brunsfeld, Damien Guard, Amaan Qureshi, and contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["third_party/grammars/cmake/**"]
precedence = "override"
SPDX-FileCopyrightText = "2025 Uy Ha"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["third_party/grammars/xml/**"]
precedence = "override"
SPDX-FileCopyrightText = "2023 ObserverOfTime"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["third_party/grammars/markdown/**"]
precedence = "override"
SPDX-FileCopyrightText = "2021 Matthias Deiml"
SPDX-License-Identifier = "MIT"
